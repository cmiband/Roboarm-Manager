<div class="app-header">
    <div class="status-dot" [class.connected]="connectedToBluetoothService()"></div>
    <span class="app-title">Arm Controller &mdash; {{ connectedToBluetoothService() ? 'Connected' : 'Not connected' }}</span>
</div>
<div class="app-content">
    @if(connectedToBluetoothService()) {
        <app-arm-manager (rotationChange)="handleRotationChange($event)"></app-arm-manager>
    } @else {
        <app-connection-creator (configChange)="handleConfigChange($event)"></app-connection-creator>
    }

    @if(showErrorMessage()) {
        <p>{{errorMessage()}}</p>
    }
</div>
